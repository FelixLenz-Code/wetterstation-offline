# Mosquitto für die Wetterstation.
#
# Zwei Einstellungen tragen den Offline-Anspruch:
#
# persistence true -- der Broker hebt Nachrichten für abgemeldete Abonnenten auf.
#   Ohne das wären Messwerte weg, sobald der Ingest neu startet, und der Ringpuffer
#   auf dem ESP32 wäre umsonst gebaut.
#
# max_queued_messages -- so viele Nachrichten hebt er je Abonnent auf. 100.000
#   reichen für gut zwei Wochen im Zweiminutentakt, also für denselben Zeitraum,
#   den auch der Ringpuffer der Station abdeckt.

listener 1883
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

allow_anonymous false
password_file /mosquitto/config/passwd

max_queued_messages 100000
# Nachrichten laufen nicht ab: ein Messwert von gestern ist immer noch ein Messwert.
message_size_limit 262144

log_dest stdout
log_type warning
log_type error
connection_messages true
