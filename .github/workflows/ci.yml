name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server (ruff + pytest)
    runs-on: ubuntu-latest

    # Die Ingest-Tests brauchen echtes Postgres. SQLite täte es nicht: der Ingest
    # lebt von INSERT ... ON CONFLICT DO UPDATE mit coalesce auf excluded, von JSONB
    # und BRIN-Indizes. Ein Test gegen SQLite gäbe grüne Haken und scheiterte im
    # Betrieb.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wetter
          POSTGRES_PASSWORD: wetter
          POSTGRES_DB: wetter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wetter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        working-directory: server
        run: ruff check wetter/ tests/

      # Die Tests laufen bewusst ohne Netz: die Meteorologie wird gegen eine
      # eingefrorene DWD-Fixture geprüft, nicht gegen den Live-Server. Sonst
      # würde eine Wartung beim DWD die CI rot färben.
      - name: Tests
        working-directory: server
        env:
          WETTER_TEST_DATABASE_URL: postgresql+psycopg://wetter:wetter@localhost:5432/wetter
        run: python -m pytest tests/ -q

      - name: Migration prüfen (hoch, zurück, wieder hoch)
        working-directory: server
        env:
          WETTER_DATABASE_URL: postgresql+psycopg://wetter:wetter@localhost:5432/migrationstest
        run: |
          psql "postgresql://wetter:wetter@localhost:5432/wetter" -c 'CREATE DATABASE migrationstest'
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  firmware:
    name: Firmware-Logik (Host-Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ringpuffer, Windfahne und die Rechenteile sind bewusst frei von
      # ESP-Abhängigkeiten und brauchen deshalb kein ESP-IDF in der CI.
      - name: Tests bauen und ausführen
        working-directory: firmware/tests
        run: make check
